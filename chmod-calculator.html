<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chmod Calculator</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --card-bg: #ffffff;
      --accent: #61c514;
      --accent-hover: #53ac12;
      --border: #e2e8f0;
      --muted: #64748b;
      --error: #ef4444;
      --success: #22c55e;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --card-bg: #1e293b;
        --border: #334155;
        --muted: #94a3b8;
        --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .result-card {
      background: var(--card-bg);
      padding: 32px;
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid var(--border);
    }

    .octal-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    #octal-input {
      font-size: 4.5rem;
      font-weight: 800;
      width: 180px;
      text-align: center;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--fg);
      display: inline-block;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      outline: none;
      padding: 4px;
      margin: 0;
      transition: all 0.2s;
    }

    #octal-input:focus {
      border-color: var(--accent);
      background: var(--card-bg);
      box-shadow: 0 0 0 3px rgba(97, 197, 20, 0.2);
    }

    #octal-input:hover {
      border-color: var(--muted);
    }

    #symbolic {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      color: var(--muted);
      letter-spacing: 4px;
      font-weight: 500;
    }

    #error-msg {
      color: var(--error);
      font-size: 0.875rem;
      margin-top: 12px;
      min-height: 1.25rem;
      font-weight: 500;
    }

    .permissions-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 16px;
      align-items: center;
    }

    .grid-header {
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .perm-label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cb-cell {
      display: flex;
      justify-content: center;
    }

    .custom-cb {
      position: relative;
      width: 54px;
      height: 54px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .custom-cb input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    .checkmark {
      height: 28px;
      width: 28px;
      background-color: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .custom-cb:hover input ~ .checkmark {
      border-color: var(--accent);
    }

    .custom-cb input:checked ~ .checkmark {
      background-color: var(--accent);
      border-color: var(--accent);
      transform: scale(1.1);
    }

    .checkmark:after {
      content: "";
      position: absolute;
      display: none;
      left: 8px;
      top: 4px;
      width: 6px;
      height: 12px;
      border: solid white;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }

    .custom-cb input:checked ~ .checkmark:after {
      display: block;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button.btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .btn-outline:hover {
      background: var(--bg);
      color: var(--fg);
      border-color: var(--muted);
    }

    @media (max-width: 480px) {
      .octal-row {
        gap: 8px;
      }
      .grid-header {
        font-size: 0.65rem;
      }
      .perm-label {
        font-size: 0.8rem;
      }
      #octal-input {
        font-size: 3.5rem;
        width: 140px;
      }
      .result-card {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>

  <main>
    <div class="result-card">
      <div class="octal-row">
        <input type="text" id="octal-input" maxlength="3" placeholder="000" autocomplete="off" aria-label="Octal value">
      </div>
      <div id="symbolic">---------</div>
      <div id="error-msg"></div>
    </div>

    <div class="permissions-card">
      <div class="grid">
        <div class="grid-spacer"></div>
        <div class="grid-header">Owner</div>
        <div class="grid-header">Group</div>
        <div class="grid-header">Public</div>

        <!-- Read -->
        <div class="perm-label">Read (4)</div>
        <div class="cb-cell">
          <label class="custom-cb">
            <input type="checkbox" data-col="0" data-val="4">
            <span class="checkmark"></span>
          </label>
        </div>
        <div class="cb-cell">
          <label class="custom-cb">
            <input type="checkbox" data-col="1" data-val="4">
            <span class="checkmark"></span>
          </label>
        </div>
        <div class="cb-cell">
          <label class="custom-cb">
            <input type="checkbox" data-col="2" data-val="4">
            <span class="checkmark"></span>
          </label>
        </div>

        <!-- Write -->
        <div class="perm-label">Write (2)</div>
        <div class="cb-cell">
          <label class="custom-cb">
            <input type="checkbox" data-col="0" data-val="2">
            <span class="checkmark"></span>
          </label>
        </div>
        <div class="cb-cell">
          <label class="custom-cb">
            <input type="checkbox" data-col="1" data-val="2">
            <span class="checkmark"></span>
          </label>
        </div>
        <div class="cb-cell">
          <label class="custom-cb">
            <input type="checkbox" data-col="2" data-val="2">
            <span class="checkmark"></span>
          </label>
        </div>

        <!-- Execute -->
        <div class="perm-label">Execute (1)</div>
        <div class="cb-cell">
          <label class="custom-cb">
            <input type="checkbox" data-col="0" data-val="1">
            <span class="checkmark"></span>
          </label>
        </div>
        <div class="cb-cell">
          <label class="custom-cb">
            <input type="checkbox" data-col="1" data-val="1">
            <span class="checkmark"></span>
          </label>
        </div>
        <div class="cb-cell">
          <label class="custom-cb">
            <input type="checkbox" data-col="2" data-val="1">
            <span class="checkmark"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-outline" onclick="resetState()">Reset</button>
      <button class="btn btn-primary" id="copy-btn" onclick="copyToClipboard()">Copy Octal</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "chmod-state";

    const checkboxes = document.querySelectorAll("input[type=checkbox]");
    const octalInput = document.getElementById("octal-input");
    const errorMsg = document.getElementById("error-msg");

    octalInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        octalInput.blur();
      }
    });

    octalInput.addEventListener("input", () => {
      validateAndSync();
    });

    function validateAndSync() {
      const val = octalInput.value;
      if (val.length === 3 && /^[0-7]{3}$/.test(val)) {
        errorMsg.textContent = "";
        const digits = val.split("").map(Number);

        checkboxes.forEach(cb => {
          const col = parseInt(cb.dataset.col);
          const bitVal = parseInt(cb.dataset.val);
          cb.checked = (digits[col] & bitVal) !== 0;
        });

        update(true);
        saveState();
        return true;
      } else {
        if (val.length > 0) {
          errorMsg.textContent = "Invalid chmod: 3 digits, each 0-7";
        } else {
          errorMsg.textContent = "";
        }
        
        checkboxes.forEach(cb => cb.checked = false);
        update(true);
        saveState();
        return false;
      }
    }

    function loadState() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (saved.length === checkboxes.length) {
        checkboxes.forEach((cb, index) => {
          cb.checked = saved[index] || false;
        });
      }
      update();
    }

    function saveState() {
      const state = Array.from(checkboxes).map(cb => cb.checked);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    checkboxes.forEach(cb => {
      cb.addEventListener("change", () => {
        update();
        saveState();
      });
    });

    function update(skipInputSync = false) {
      let cols = [0, 0, 0];
      checkboxes.forEach(cb => {
        if (cb.checked) {
          let col = parseInt(cb.dataset.col);
          let val = parseInt(cb.dataset.val);
          cols[col] += val;
        }
      });

      function toSymbol(n) {
        return [
          (n & 4) ? "r" : "-",
          (n & 2) ? "w" : "-",
          (n & 1) ? "x" : "-"
        ].join("");
      }

      let octal = cols.join("");
      let symbolic = cols.map(toSymbol).join("");

      if (!skipInputSync) {
        octalInput.value = octal;
      }
      document.getElementById("symbolic").textContent = symbolic;
    }

    function resetState() {
      localStorage.removeItem(STORAGE_KEY);
      checkboxes.forEach(cb => cb.checked = false);
      update();
      errorMsg.textContent = "";
    }

    function copyToClipboard() {
      const text = octalInput.value;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copy-btn');
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        const originalBg = btn.style.background;
        btn.style.background = 'var(--success)';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = originalBg;
        }, 1500);
      });
    }

    // Init
    loadState();

    // PWA setup (inline manifest and SW)
    const manifest = {
      name: "Chmod Calculator",
      short_name: "ChmodCalc",
      start_url: ".",
      display: "standalone",
      background_color: "#f8fafc",
      theme_color: "#2563eb",
      icons: []
    };

    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(blob);
    const link = document.querySelector('link[rel="manifest"]') || document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    if (!link.parentNode) document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], { type: 'text/javascript' });
      const swURL = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL).catch(console.error);
    }
  </script>

</body>
</html>
